name: Periksa aturan & skills
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validasi AGENTS.md, skills, dan versi plugin
        run: node scripts/check.mjs
